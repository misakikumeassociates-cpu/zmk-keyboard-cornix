# しろ（Cornix LP）用の build.yaml ― 下書き（2026-11-10）
# 使い方：zhenlonghe/zmk-keyboard-cornix を fork したリポジトリの build.yaml をこれに置き換える。
# GitHub Actions がこの一覧の分だけ .uf2 を作る（Actions → いちばん新しい実行 → Artifacts の firmware.zip）。
#
# 元の zhenlonghe 版からの違い
#   - ドングルを nice!nano＋画面 から Seeed XIAO nRF52840（画面なし）に替えた
#       board は ZMK main での名前 xiao_ble//zmk（app/boards/seeed/xiao_ble/xiao_ble.zmk.yml の id）
#       XIAO は買ったときの SoftDevice 入りの配置のまま使うので snippet nrf52840-nosd は付けない
#       画面が無いので CONFIG_ZMK_DISPLAY を切る（cornix_dongle_adapter.conf が =y にしているため）
#   - ドングルなしの左（cornix_left）に CONFIG_ZMK_POINTING を足し（しろ の keymap がホイール・中クリックを使う）、
#     左右の接続間隔を 7.5ms に戻した（下の注）
#   - 作るものを しろ に要るものだけにした
#   - 左右とも深い眠り（deep sleep）を切った（-DCONFIG_ZMK_SLEEP=n）。公式ファームと同じく「つないだまま」にする（2026-11-10 久米と決定）
---
include:
  # ---- ドングル構成（本命）：左右とも無線で XIAO へ、XIAO を PC に USB ----
  - board: xiao_ble//zmk
    shield: cornix_dongle_adapter
    cmake-args: -DCONFIG_ZMK_DISPLAY=n
    artifact-name: shiro_dongle_xiao

  - board: cornix_ph_left
    shield: cornix_indicator
    cmake-args: -DCONFIG_ZMK_SLEEP=n
    artifact-name: shiro_left_for_dongle

  - board: cornix_right
    shield: cornix_indicator
    cmake-args: -DCONFIG_ZMK_SLEEP=n
    artifact-name: shiro_right

  # ---- ドングルなし（段階1・今使っている形：左は USB 有線の central、右は左へ無線）----
  #   接続間隔 7.5ms（規格の下限。zhenlonghe 版は電池のため 11.25ms に伸ばしている）
  #   latency 0：右が休んだあとの1打目が待たされて「ない」→「あに」になるのを防ぐ（11/10〜11 の測定で決定。右の電池は増える）
  #   深い眠りなし・ZMK Studio あり（Studio は central＝左だけに入れる。snippet と CONFIG_ZMK_STUDIO の両方が要る）
  - board: cornix_left
    shield: cornix_indicator
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_POINTING=y -DCONFIG_ZMK_SPLIT_BLE_PREF_INT=6 -DCONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0 -DCONFIG_ZMK_SLEEP=n -DCONFIG_ZMK_STUDIO=y
    artifact-name: shiro_left_studio_lat0

  # ---- 電池表示用：上の shiro_left_studio_lat0 に USB の 2 つ目の HID（ベンダー定義）を足す。Windows が右の電池を読む ----
  - board: cornix_left
    shield: cornix_indicator
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_POINTING=y -DCONFIG_ZMK_SPLIT_BLE_PREF_INT=6 -DCONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0 -DCONFIG_ZMK_SLEEP=n -DCONFIG_ZMK_STUDIO=y -DCONFIG_CORNIX_BATTERY_HID=y -DCONFIG_USB_HID_DEVICE_COUNT=2
    artifact-name: shiro_left_studio_lat0_bat
  # 右は上の shiro_right をそのまま使う（ドングルあり・なしで同じ）

  # ---- 比べる用：latency 5（11/10 に最初に入れた形・Studio なし）----
  - board: cornix_left
    shield: cornix_indicator
    cmake-args: -DCONFIG_ZMK_POINTING=y -DCONFIG_ZMK_SPLIT_BLE_PREF_INT=6 -DCONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=5 -DCONFIG_ZMK_SLEEP=n
    artifact-name: shiro_left_lat5

  # ---- 控え：LED と zhenlonghe さん独自の立ち直りの仕組みを入れない版 ----
  #   cornix_indicator を外すと、LED・切断からの立ち直り・フリーズ時の再起動（独自の C のコード約1,200行）が入らない。
  #   残るのは基板の定義と無線の設定（時計の補正・+8dBm・1M PHY・接続間隔）だけ。独自のコードが怪しいときに入れ替える
  - board: cornix_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_POINTING=y -DCONFIG_ZMK_SPLIT_BLE_PREF_INT=6 -DCONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0 -DCONFIG_ZMK_SLEEP=n -DCONFIG_ZMK_STUDIO=y
    artifact-name: shiro_left_studio_lat0_plain

  - board: cornix_right
    cmake-args: -DCONFIG_ZMK_SLEEP=n
    artifact-name: shiro_right_plain

  # ---- 設定の消去（役割を替えるとき・元に戻すときに、必ず先に入れる）----
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: reset_xiao

  - board: cornix_left
    shield: settings_reset
    artifact-name: reset_cornix_left      # 左は cornix_left でも cornix_ph_left でもこれで消す

  - board: cornix_right
    shield: settings_reset
    artifact-name: reset_cornix_right
